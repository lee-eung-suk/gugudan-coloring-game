<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>곱셈구구 색칠하기</title>
    <meta name="description" content="구구단을 선택해서 귀여운 동물을 색칠하는 초등 2학년 수학 놀이 게임">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- ============== 화면 1 : 타이틀 ============== -->
        <section id="screen-title" class="screen active">
            <div class="title-parade">🐰　🐻　🐱　🐧　🦁　🐯　🐸　🦊　🐰　🐻　🐱　🐧</div>

            <div class="title-logo">
                <span class="badge">초등 2학년 수학 놀이</span>
                <h1>🎨 곱셈구구<br>색칠하기</h1>
                <p>구구단을 골라 동물 친구를 색칠해봐요!</p>
            </div>

            <div class="title-buttons">
                <button class="btn btn-red" onclick="goSelect()">▶ 게임 시작</button>
                <button class="btn btn-blue" onclick="goBook()">📖 내 도감</button>
            </div>

            <div class="title-sound">
                <button class="icon-btn icon-btn-dark" onclick="toggleSound()"><span class="sound-icon">🔊</span></button>
            </div>
        </section>

        <!-- ============== 화면 2 : 구구단 셀렉트 ============== -->
        <section id="screen-select" class="screen">
            <div class="topbar">
                <button class="btn btn-gray btn-sm" onclick="goTitle()">◀ 처음으로</button>
                <div class="topbar-title">🎮 몇 단을 할까요?</div>
                <button class="icon-btn icon-btn-dark" onclick="toggleSound()"><span class="sound-icon">🔊</span></button>
            </div>
            <div id="select-stars" class="stars-banner">⭐ 0 / 24</div>
            <div id="select-grid" class="select-grid"></div>
        </section>

        <!-- ============== 화면 3 : 색칠 플레이 ============== -->
        <section id="screen-play" class="screen">
            <div class="topbar">
                <button class="btn btn-gray btn-sm" onclick="goSelect()">◀ 단 선택</button>
                <div class="topbar-title"><span id="play-emoji">🐰</span> <span id="play-title">2단</span></div>
                <button class="icon-btn icon-btn-dark" onclick="toggleSound()"><span class="sound-icon">🔊</span></button>
            </div>

            <div class="play-panel">
                <div class="play-progress-row">
                    <span class="progress-label">🎨</span>
                    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
                    <div id="progress-text" class="progress-text">0 / 7</div>
                </div>

                <div class="svg-wrap" id="svg-container"></div>

                <div id="selection-info" class="coach coach-default">
                    <span class="coach-text">팔레트에서 정답 물감을 고른 다음, 그림의 문제를 눌러요!</span>
                </div>

                <div id="palette-grid" class="palette-grid"></div>

                <div class="play-actions">
                    <button class="btn btn-yellow btn-sm" onclick="giveHint()">💡 힌트</button>
                    <button class="btn btn-gray btn-sm" onclick="resetGame()">🔄 다시하기</button>
                </div>
            </div>

            <div id="victory-card" class="victory-card hidden">
                <div id="victory-record" class="victory-record hidden">🏅 새 기록!</div>
                <div id="victory-art" class="victory-art"></div>
                <h2 id="victory-name">완성!</h2>
                <div id="victory-stars" class="victory-stars">★★★</div>
                <div class="victory-actions">
                    <button class="btn btn-yellow" onclick="goSelect()">다른 동물 하기</button>
                    <button class="btn btn-blue" onclick="goBook()">📖 도감 보기</button>
                </div>
            </div>
        </section>

        <!-- ============== 화면 4 : 도감 ============== -->
        <section id="screen-book" class="screen">
            <div class="topbar">
                <button class="btn btn-gray btn-sm" onclick="goSelect()">◀ 단 선택</button>
                <div class="topbar-title">📖 동물 도감</div>
                <button class="btn btn-gray btn-sm" onclick="goTitle()">처음으로</button>
            </div>

            <div id="book-complete-badge" class="book-complete-badge hidden">🏆 동물을 전부 모았어요!</div>
            <div id="book-grid" class="book-grid"></div>
            <div id="book-summary" class="book-summary">모은 동물: 0 / 8</div>
        </section>

    </div>

    <div class="credit-footer">제작자 소천초 2학년 정라온</div>

    <script src="js/animals.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
